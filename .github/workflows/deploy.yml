name: Enterprise CRM Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Backend TypeScript Build
        run: npx tsc --noEmit

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Validate Frontend TypeScript Build
        run: |
          cd client
          npx tsc --noEmit

  docker-scan-and-push:
    name: Build & Security Scan Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Production Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: crm-backend:latest

      - name: Security Scan Container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crm-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Zero-Downtime Production Deployment
    needs: docker-scan-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/customer-support-ivr-system
            git pull origin main
            docker-compose -f docker-compose.prod.yml up --build -d
            docker image prune -f

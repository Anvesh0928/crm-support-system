name: Enterprise CRM Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Backend Syntax & Build
        run: |
          cd backend
          node --check server.js || npm run build --if-present

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

  docker-scan:
    name: Build & Security Scan Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: crm-backend:latest

      - name: Security Scan Container with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'crm-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Zero-Downtime Production Deployment
    needs: docker-scan
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.PROD_SERVER_IP }}" ] && [ -n "${{ secrets.PROD_SERVER_USER }}" ] && [ -n "${{ secrets.PROD_SSH_PRIVATE_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Notice: Deployment secrets (PROD_SERVER_IP, PROD_SERVER_USER, PROD_SSH_PRIVATE_KEY) are not set. Skipping remote SSH deploy step."
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/customer-support-ivr-system
            git pull origin main
            docker-compose -f docker-compose.prod.yml up --build -d
            docker image prune -f

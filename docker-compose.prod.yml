services:
  # MongoDB Production Database
  mongodb:
    image: mongo:7.0
    container_name: crm_mongodb_prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: customer_support_crm
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7.2 Cache & Pub/Sub Broker
  redis:
    image: redis:7.2-alpine
    container_name: crm_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js Express + Socket.IO API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/customer_support_crm
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_network

  # React Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend_prod
    restart: unless-stopped
    networks:
      - crm_network

  # Nginx Reverse Proxy / Ingress Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: crm_nginx_ingress
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  mongo_prod_data:
  redis_prod_data:
